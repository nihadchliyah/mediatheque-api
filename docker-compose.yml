services:
  db:
    image: postgres:17
    container_name: mediatheque-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-mediatheque}
    ports:
      - "5434:5432"
    volumes:
      - mediatheque-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: .
      target: construction
    profiles: ["api"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mediatheque}?schema=public
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    profiles: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mediatheque}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  mediatheque-data:
